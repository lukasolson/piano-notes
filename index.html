<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Piano Note Trainer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="header">
        <h1>Piano Note Trainer</h1>
        <p id="modeDescription">Play the shown note on a piano. Any octave counts.</p>
      </header>

      <section class="target-card">
        <p class="label">Target Note</p>
        <div class="option-row">
          <label for="displayMode" class="option-label">Display</label>
          <select id="displayMode" class="select-input">
            <option value="name">Note Name</option>
            <option value="staff">Staff</option>
          </select>
        </div>
        <div id="clefControls" class="option-row hidden">
          <label for="clefMode" class="option-label">Clef</label>
          <select id="clefMode" class="select-input">
            <option value="treble">Treble</option>
            <option value="bass">Bass</option>
          </select>
        </div>
        <div class="target-display">
          <p id="targetNote" class="target-note">--</p>
          <div id="staffWrapper" class="staff-wrapper hidden" aria-hidden="true">
            <svg
              id="targetStaff"
              class="target-staff"
              viewBox="0 0 220 110"
              role="img"
              aria-label="Target note on staff"
            ></svg>
          </div>
        </div>
      </section>

      <section class="status-card">
        <p class="label">Detected</p>
        <p id="detectedNote" class="detected-note">Listening inactive</p>
        <p id="detectedFrequency" class="frequency">-- Hz</p>
        <p class="label streak-label">Streak</p>
        <p id="streakCount" class="streak-count">0</p>
        <div class="metrics-grid">
          <div>
            <p class="label metric-label">Accuracy</p>
            <p id="accuracyValue" class="metric-value">0%</p>
          </div>
          <div>
            <p class="label metric-label">Speed</p>
            <p id="speedValue" class="metric-value">-- s/note</p>
          </div>
        </div>
      </section>

      <section class="controls">
        <button id="startButton" class="btn">Start Microphone</button>
        <p id="hint" class="hint">
          Tap to allow microphone access, then play notes one at a time.
        </p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
